name: Build Android (APK & AAB)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup environment file
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Setup Signing Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Create debug keystore if missing
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Release keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          elif [ -f upload.keystore.base64 ]; then
            echo "Using permanent upload.keystore.base64 from repository..."
            cat upload.keystore.base64 | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          elif [ -f my-upload-key.jks ]; then
            echo "Using existing my-upload-key.jks..."
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          else
            echo "Creating permanent upload keystore..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Bubble Pop Blitz,O=AI Studio,C=US"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BubblePopBlitz-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BubblePopBlitz-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BubblePopBlitz-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
